[package]
name = "duskspire-escrow"
version = "0.1.0"
description = "Duskspire arena stake escrow: player deposits, authority-settled pots with rake"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "duskspire_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
